# Cloud Build configuration for PODS application
# This builds and deploys the application to Google Cloud Run

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-backend:$_COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-backend:latest'
      - '--target'
      - 'backend-prod'
      - '.'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-frontend:$_COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-frontend:latest'
      - '--target'
      - 'frontend-prod'
      - '--build-arg'
      - 'VITE_API_BASE_URL=$_BACKEND_API_BASE_URL'
      - '.'

  # Build ML service image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-ml-service:$_COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pods-ml-service:latest'
      - '-f'
      - 'ml-service/Dockerfile'
      - 'ml-service'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pods-backend:$_COMMIT_SHA'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pods-frontend:$_COMMIT_SHA'

  # Push ML service image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pods-ml-service:$_COMMIT_SHA'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pods-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pods-backend:$_COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3001'
      - '--set-env-vars'
      - 'NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=$_CLOUD_SQL_CONNECTION_NAME,DB_NAME=pods_db,DB_USER=pods_user,DB_PASSWORD=pods_password,GEMINI_API_KEY=$_GEMINI_API_KEY,FRONTEND_URL=$_FRONTEND_URL,ML_SERVICE_URL=$_ML_SERVICE_URL'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_CONNECTION_NAME'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pods-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pods-frontend:$_COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

  # Deploy ML service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pods-ml-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pods-ml-service:$_COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--set-env-vars'
      - 'DATABASE_URL=postgresql://pods_user:pods_password@$_CLOUD_SQL_CONNECTION_NAME/pods_db'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_CONNECTION_NAME'

# Substitute variables
substitutions:
  _CLOUD_SQL_CONNECTION_NAME: 'your-project-id:us-central1:pods-postgres'  # Replace with your Cloud SQL instance connection name
  _GEMINI_API_KEY: ''  # Set your Gemini API key in Cloud Build trigger or secret
  _COMMIT_SHA: 'latest'  # Default commit SHA
  _FRONTEND_URL: 'https://pods-frontend-qgatq7aifq-uc.a.run.app'
  _BACKEND_API_BASE_URL: 'https://pods-backend-qgatq7aifq-uc.a.run.app/api'
  _ML_SERVICE_URL: 'https://pods-ml-service-qgatq7aifq-uc.a.run.app'

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  env:
    - 'DOCKER_BUILDKIT=1'

# Images to push
images:
  - 'gcr.io/$PROJECT_ID/pods-backend:$_COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pods-frontend:$_COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pods-ml-service:$_COMMIT_SHA'