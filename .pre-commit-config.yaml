repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm run lint:eslint -w frontend
        language: system
        pass_filenames: false
      - id: backend-eslint
        name: Backend ESLint
        entry: npm run lint:eslint -w backend
        language: system
        pass_filenames: false
      - id: prettier-check
        name: Prettier Check
        entry: npm run format:check
        language: system
        pass_filenames: false
