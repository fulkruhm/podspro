name: Datadog Synthetics

on:
  # Run after a successful deployment to main
  # Uncomment and adjust this trigger once you have a deployed URL
  # workflow_run:
  #   workflows: ["Deploy"]
  #   types: [completed]

  # For now, trigger manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  e2e_testing:
    name: Run Synthetic Tests
    runs-on: ubuntu-latest

    # Only run if you have Datadog credentials configured
    # Add DD_API_KEY and DD_APP_KEY in:
    # GitHub repo → Settings → Secrets and variables → Actions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@v3.8.2
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
          # Once you create Synthetic tests in Datadog, add their public IDs here
          # public-ids: |
          #   abc-d3f-ghi
          #   jkl-mn0-pqr
          #
          # Or run all tests tagged with a label:
          test-search-query: 'tag:podspro'
          # Point to your deployed app URL when ready:
          # variables: 'START_URL=https://your-deployed-url.com'