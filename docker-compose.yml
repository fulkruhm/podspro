services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: pods-postgres
    environment:
      POSTGRES_DB: pods_db
      POSTGRES_USER: pods_user
      POSTGRES_PASSWORD: pods_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pods_user -d pods_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: pods-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
    container_name: pods-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - AI_RESPONSE_TIMEOUT_MS=150000
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-pods-compose-local-dev-auth-secret-change-this-123456}
      - DATABASE_URL=postgresql://pods_user:pods_password@postgres:5432/pods_db
      - REDIS_URL=redis://redis:6379
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Run database seed once after postgres is ready
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: pods-seeder
    working_dir: /app/backend
    environment:
      - DATABASE_URL=postgresql://pods_user:pods_password@postgres:5432/pods_db
      - NODE_ENV=production
      - SEED_PRODUCT_MULTIPLIER=2
      - SEED_ROUTE_MULTIPLIER=2
      - SEED_HISTORY_DAYS=84
      - SEED_FORECAST_DAYS=14
    command: sh -c "sleep 5 && npm run seed"
    profiles:
      - seed
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3

  # Python ML Service - Anomaly Detection & Forecasting
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pods-ml-service
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://pods_user:pods_password@postgres:5432/pods_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-prod
    container_name: pods-frontend
    ports:
      - "80:80"
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:3001
      - VITE_API_BASE_URL=http://backend:3001/api
    depends_on:
      - backend
      - ml-service

volumes:
  postgres_data:
  redis_data:
